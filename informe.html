<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis gratuito — Massatorii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#070C15;
    --navy-2:#0F1626;
    --navy-3:#151E33;
    --navy-4:#1C2740;
    --red:#D73427;
    --green:#25D366;
    --gold:#D9A441;
    --blue:#4C8DFF;
    --text:#EDEFF3;
    --text-muted:#8A93A6;
    --border:#22304C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Space Grotesk', sans-serif;
    background:radial-gradient(circle at top, #0C1424 0%, var(--navy) 60%);
    color:var(--text);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:720px; margin:0 auto;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
  .brand{font-size:16px; font-weight:800; letter-spacing:0.5px;}
  .brand span{color:var(--red);}
  .badge-free{
    font-size:10px; font-weight:700; color:var(--gold); border:1px solid var(--gold);
    padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.5px;
  }

  .hero{margin-bottom:22px;}
  .hero .empresa{font-size:26px; font-weight:800; margin:0 0 4px;}
  .hero .ciudad{font-size:13px; color:var(--text-muted); margin:0;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  @media (max-width:520px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:linear-gradient(180deg, var(--navy-3), var(--navy-2));
    border:1px solid var(--border); border-radius:16px; padding:20px;
  }
  .panel-wide{grid-column:1 / -1;}

  .main-gauge{
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  }
  .main-gauge .label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-muted);
    margin:0 0 6px;
  }
  .main-gauge .headline{font-size:15px; font-weight:600; line-height:1.4; max-width:280px;}

  .stat-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .stat-mini{
    background:var(--navy-4); border-radius:12px; padding:14px 12px; text-align:center;
  }
  .stat-mini .n{font-size:22px; font-weight:800; margin:0;}
  .stat-mini .l{font-size:10px; color:var(--text-muted); margin:4px 0 0; text-transform:uppercase; letter-spacing:0.4px;}

  .compare{margin-top:16px;}
  .compare-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .compare-label{font-size:12px; width:110px; flex-shrink:0; color:var(--text-muted);}
  .compare-bar-bg{flex:1; height:14px; background:var(--navy-4); border-radius:8px; overflow:hidden;}
  .compare-bar{height:100%; border-radius:8px;}
  .compare-val{font-size:12px; font-weight:700; width:44px; text-align:right;}

  .detalle-title{font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-muted); margin:0 0 10px;}
  .detalle-list{margin:0; padding:0; list-style:none;}
  .detalle-list li{
    font-size:13px; line-height:1.6; padding:10px 0; border-bottom:1px solid var(--border);
    display:flex; gap:10px;
  }
  .detalle-list li:last-child{border-bottom:none;}
  .dot{width:6px; height:6px; border-radius:50%; margin-top:7px; flex-shrink:0;}

  .cta{
    background:linear-gradient(135deg, var(--red), #8f2119);
    border-radius:16px; padding:22px 24px; text-align:center; margin-top:14px;
  }
  .cta p.big{margin:0 0 6px; font-size:16px; font-weight:700;}
  .cta p.small{margin:0; font-size:12.5px; opacity:0.9;}

  .footer{text-align:center; margin-top:22px; font-size:10px; color:var(--text-muted);}
  .loading, .error{text-align:center; padding:80px 20px; color:var(--text-muted); font-size:14px;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">Cargando análisis...</div>
</div>

<script>
const SUPABASE_URL = "https://govlsomhnxhlgdkkxibd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdvdmxzb21obnhobGdka2t4aWJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2Nzg3NDUsImV4cCI6MjA5ODI1NDc0NX0.RUAaSS1sKSRWpBKsFcc8FH0iKZaoBBeG_bXVCSbWKSs";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function gaugeSVG(pct){
  const size = 148, stroke = 13, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  const color = pct >= 30 ? '#D73427' : pct >= 15 ? '#D9A441' : '#25D366';
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1C2740" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="48%" text-anchor="middle" fill="#EDEFF3" font-size="30" font-weight="800" font-family="Space Grotesk">${pct}%</text>
      <text x="50%" y="63%" text-anchor="middle" fill="#8A93A6" font-size="9.5" font-family="Space Grotesk">leads perdidos</text>
    </svg>
  `;
}

function parseFactores(texto){
  // Extrae fragmentos legibles del texto técnico para listarlos como factores
  const factores = [];
  if(!texto) return factores;
  if(/horario|abiertos de 168h/i.test(texto)){
    const m = texto.match(/\(([\d.]+)h abiertos de 168h/);
    factores.push({ tipo: m ? 'warn' : 'info', txt: 'Horario público con huecos sin cobertura de respuesta.' });
  }
  if(/quejas de respuesta detectadas|falta de respuesta/i.test(texto) && !/sin quejas/i.test(texto)){
    factores.push({ tipo: 'danger', txt: 'Reseñas de clientes mencionando falta de respuesta.' });
  } else if(/sin quejas de respuesta/i.test(texto)){
    factores.push({ tipo: 'ok', txt: 'Sin quejas de respuesta en las reseñas públicas.' });
  }
  if(/rapidez de respuesta/i.test(texto)){
    factores.push({ tipo: 'ok', txt: 'Clientes destacan la rapidez de respuesta actual.' });
  }
  if(/equipo de \d+ persona/i.test(texto)){
    const m = texto.match(/equipo de (\d+) persona/i);
    factores.push({ tipo: 'info', txt: `Equipo detectado: ${m[1]} persona(s) dedicadas.` });
  }
  if(/chat en vivo/i.test(texto)){
    factores.push({ tipo: 'ok', txt: 'Ya cuentan con chat en vivo instalado en su web.' });
  }
  return factores;
}

const dotColor = { danger: 'var(--red)', warn: 'var(--gold)', ok: 'var(--green)', info: 'var(--blue)' };

async function render(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const app = document.getElementById('app');

  if(!id){
    app.innerHTML = `<div class="error">Falta el identificador del informe.</div>`;
    return;
  }

  const { data, error } = await sb.from('pipeline_manual')
    .select('empresa, ciudad, sector, auditoria_pct, auditoria_texto')
    .eq('id', id)
    .single();

  if(error || !data || data.auditoria_pct == null){
    app.innerHTML = `<div class="error">Este informe todavía no está disponible.</div>`;
    return;
  }

  const nombreEmpresa = data.empresa || 'tu negocio';
  const pct = data.auditoria_pct;
  const conMassatorii = Math.max(2, Math.round(pct * 0.08));
  const factores = parseFactores(data.auditoria_texto);

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">MASSATORII<span>.</span></div>
      <div class="badge-free">Análisis gratuito</div>
    </div>

    <div class="hero">
      <p class="empresa">${nombreEmpresa}</p>
      <p class="ciudad">${data.ciudad || ''}${data.sector ? ' · ' + (data.sector === 'legal' ? 'Sector legal' : 'Sector inmobiliario') : ''}</p>
    </div>

    <div class="grid">
      <div class="panel">
        <p class="label">Estimación actual</p>
        <div class="main-gauge">
          ${gaugeSVG(pct)}
          <p class="headline">de los leads que os escriben se podrían estar perdiendo por tardar en responder.</p>
        </div>
      </div>

      <div class="panel">
        <p class="label" style="margin-bottom:14px;">Comparativa</p>
        <div class="compare">
          <div class="compare-row">
            <span class="compare-label">Ahora mismo</span>
            <div class="compare-bar-bg"><div class="compare-bar" style="width:${pct}%; background:var(--red);"></div></div>
            <span class="compare-val" style="color:var(--red);">${pct}%</span>
          </div>
          <div class="compare-row">
            <span class="compare-label">Con Massatorii</span>
            <div class="compare-bar-bg"><div class="compare-bar" style="width:${conMassatorii}%; background:var(--green);"></div></div>
            <span class="compare-val" style="color:var(--green);">${conMassatorii}%</span>
          </div>
        </div>
        <div class="stat-row" style="margin-top:16px;">
          <div class="stat-mini">
            <p class="n">24/7</p>
            <p class="l">Respuesta</p>
          </div>
          <div class="stat-mini">
            <p class="n">&lt;1min</p>
            <p class="l">1ª respuesta</p>
          </div>
          <div class="stat-mini">
            <p class="n">100%</p>
            <p class="l">Leads cubiertos</p>
          </div>
        </div>
      </div>

      <div class="panel panel-wide">
        <p class="detalle-title">Qué hemos revisado</p>
        <ul class="detalle-list">
          ${factores.map(f => `<li><span class="dot" style="background:${dotColor[f.tipo]};"></span>${f.txt}</li>`).join('') || `<li><span class="dot" style="background:var(--blue);"></span>${data.auditoria_texto || ''}</li>`}
        </ul>
      </div>
    </div>

    <div class="cta">
      <p class="big">¿Bajamos esto a un ${conMassatorii}%?</p>
      <p class="small">Responde a este mismo chat de WhatsApp y lo vemos juntos, sin compromiso.</p>
    </div>

    <div class="footer">Análisis basado en datos públicos (horario, reseñas y web de Google) · Massatorii</div>
  `;
}

render();
</script>
</body>
</html>
